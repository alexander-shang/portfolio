<link rel="stylesheet" href="style.css">
</head>
<body class="page--contact">

<header class="top">
  <span class="logo">AS</span>
  <nav class="tabs">
    <a href="index.html" class="tab tab--ghost"><span class="tab__label">home</span><span class="tab__num"><sup>1</sup></span></a>
    <span class="tab-sep" aria-hidden="true"></span>
    <a href="about.html" class="tab tab--ghost"><span class="tab__label">about</span><span class="tab__num"><sup>2</sup></span></a>
    <span class="tab-sep" aria-hidden="true"></span>
    <a href="work.html" class="tab tab--ghost"><span class="tab__label">work</span><span class="tab__num"><sup>3</sup></span></a>
    <span class="tab-sep" aria-hidden="true"></span>
    <a href="contact.html" class="tab tab--active"><span class="tab__label">contact</span><span class="tab__num"><sup>4</sup></span></a>

    <a href="studio.html" class="tab tab--ghost"><span class="tab__label">studio</span><span class="tab__num"><sup>5</sup></span></a>
  </nav>
</header>

<main class="contact-page">
  <h1 class="headline">Let's talk.</h1>
  <p class="contact-lede">Open to product analyst, PM, and data-facing roles. Send a message and I'll get back to you.</p>

  <form id="contact-form" class="contact-form" novalidate>
    <div class="form-field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required />
    </div>

    <div class="form-field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />
    </div>

    <div class="form-field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>

    <button type="submit" class="btn-submit" id="form-submit">Send message</button>
    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
  </form>
</main>

<script src="nav.js"></script>
<script src="contact.js"></script>
</body>
</html>
